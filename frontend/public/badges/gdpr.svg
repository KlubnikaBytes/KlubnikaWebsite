<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <path id="topArcGdpr" d="M 65,250 A 185,185 0 0,1 435,250" fill="none" />
    <path id="bottomArcGdpr" d="M 435,250 A 185,185 0 0,1 65,250" fill="none" />
    <linearGradient id="euGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003399" />
      <stop offset="100%" stop-color="#001F5C" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDD00" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>
  </defs>

  <!-- Outer Circle: European Union Blue -->
  <circle cx="250" cy="250" r="235" fill="url(#euGrad)" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="#FFCC00" stroke-width="4" stroke-opacity="0.8" />

  <!-- Top Arc Text: DATA PRIVACY & PROTECTION -->
  <text fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="28" letter-spacing="4">
    <textPath href="#topArcGdpr" startOffset="50%" text-anchor="middle">DATA PRIVACY &amp; PROTECTION</textPath>
  </text>

  <!-- Bottom Arc Text: REGULATION (EU) 2016/679 -->
  <text fill="#FFCC00" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="26" letter-spacing="3">
    <textPath href="#bottomArcGdpr" startOffset="50%" text-anchor="middle">REGULATION (EU) 2016/679</textPath>
  </text>

  <!-- Inner Circle Container -->
  <circle cx="250" cy="250" r="145" fill="#FFFFFF" stroke="#003399" stroke-width="8" />

  <!-- The 12 Iconic European Union Yellow Stars inside Inner Border -->
  <!-- 12 stars placed precisely in a 360-degree circle (radius ~124) -->
  <g fill="#FFCC00" stroke="#E6A800" stroke-width="0.8">
    <!-- 12 o'clock -->
    <polygon points="250,126 253,133 260,133 255,138 257,145 250,141 243,145 245,138 240,133 247,133" />
    <!-- 1 o'clock -->
    <polygon points="312,142 315,149 322,149 317,154 319,161 312,157 305,161 307,154 302,149 309,149" />
    <!-- 2 o'clock -->
    <polygon points="358,188 361,195 368,195 363,200 365,207 358,203 351,207 353,200 348,195 355,195" />
    <!-- 3 o'clock -->
    <polygon points="374,250 377,257 384,257 379,262 381,269 374,265 367,269 369,262 364,257 371,257" />
    <!-- 4 o'clock -->
    <polygon points="358,312 361,319 368,319 363,324 365,331 358,327 351,331 353,324 348,319 355,319" />
    <!-- 5 o'clock -->
    <polygon points="312,358 315,365 322,365 317,370 319,377 312,373 305,377 307,370 302,365 309,365" />
    <!-- 6 o'clock -->
    <polygon points="250,374 253,381 260,381 255,386 257,393 250,389 243,393 245,386 240,381 247,381" />
    <!-- 7 o'clock -->
    <polygon points="188,358 191,365 198,365 193,370 195,377 188,373 181,377 183,370 178,365 185,365" />
    <!-- 8 o'clock -->
    <polygon points="142,312 145,319 152,319 147,324 149,331 142,327 135,331 137,324 132,319 139,319" />
    <!-- 9 o'clock -->
    <polygon points="126,250 129,257 136,257 131,262 133,269 126,265 119,269 121,262 116,257 123,257" />
    <!-- 10 o'clock -->
    <polygon points="142,188 145,195 152,195 147,200 149,207 142,203 135,207 137,200 132,195 139,195" />
    <!-- 11 o'clock -->
    <polygon points="188,142 191,149 198,149 193,154 195,161 188,157 181,161 183,154 178,149 185,149" />
  </g>

  <!-- Central Security Shield Motif -->
  <path d="M 250,165 L 295,182 C 295,245 250,285 250,285 C 250,285 205,245 205,182 Z" fill="#F0F5FA" stroke="#003399" stroke-width="4" />
  
  <!-- Padlock inside Shield -->
  <rect x="235" y="222" width="30" height="24" rx="4" fill="#003399" />
  <path d="M 241,222 V 212 A 9,9 0 0,1 259,212 V 222" fill="none" stroke="#003399" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="250" cy="232" r="3" fill="#FFFFFF" />
  <line x1="250" y1="233" x2="250" y2="240" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

  <!-- Prominent GDPR Typography -->
  <text x="250" y="325" text-anchor="middle" fill="#003399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="52" letter-spacing="4">GDPR</text>

  <!-- Ribbon Pill: COMPLIANT -->
  <rect x="160" y="338" width="180" height="34" rx="17" fill="#FFCC00" />
  <text x="250" y="361" text-anchor="middle" fill="#003399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="19" letter-spacing="2">COMPLIANT</text>
</svg>

