<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <path id="topArcHipaa" d="M 65,250 A 185,185 0 0,1 435,250" fill="none" />
    <path id="bottomArcHipaa" d="M 435,250 A 185,185 0 0,1 65,250" fill="none" />
    <linearGradient id="hipaaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E487A" />
      <stop offset="100%" stop-color="#062947" />
    </linearGradient>
  </defs>

  <!-- Outer Circle -->
  <circle cx="250" cy="250" r="235" fill="url(#hipaaBlue)" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="#25B4E0" stroke-width="4" stroke-opacity="0.8" />

  <!-- Top Arc Text: HIPAA COMPLIANT -->
  <text fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="42" letter-spacing="6">
    <textPath href="#topArcHipaa" startOffset="50%" text-anchor="middle">HIPAA COMPLIANT</textPath>
  </text>

  <!-- Bottom Arc Text: PRIVACY & DATA SECURITY -->
  <text fill="#25B4E0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="28" letter-spacing="3">
    <textPath href="#bottomArcHipaa" startOffset="50%" text-anchor="middle">PRIVACY &amp; SECURITY</textPath>
  </text>

  <!-- Left Star -->
  <polygon points="78,250 87,242 98,247 93,235 101,226 89,228 82,218 78,228 67,230 76,238" fill="#25B4E0" transform="rotate(-15 84 235)" />
  <!-- Right Star -->
  <polygon points="422,250 413,242 402,247 407,235 399,226 411,228 418,218 422,228 433,230 424,238" fill="#25B4E0" transform="rotate(15 416 235)" />

  <!-- Inner Circle Container -->
  <circle cx="250" cy="250" r="145" fill="#FFFFFF" stroke="#0E487A" stroke-width="8" />

  <!-- Medical Security Shield Background -->
  <path d="M 250,155 L 305,178 C 305,250 250,295 250,295 C 250,295 195,250 195,178 Z" fill="#F0F8FD" stroke="#0E487A" stroke-width="4" />

  <!-- Medical Cross Symbol (Bold Red / Crimson) -->
  <rect x="238" y="185" width="24" height="66" rx="4" fill="#D32F2F" />
  <rect x="217" y="206" width="66" height="24" rx="4" fill="#D32F2F" />

  <!-- Shield Security Lock Overlay -->
  <circle cx="250" cy="218" r="10" fill="#FFFFFF" />
  <rect x="246" y="214" width="8" height="8" rx="2" fill="#0E487A" />

  <!-- Prominent HIPAA Wordmark -->
  <text x="250" y="338" text-anchor="middle" fill="#0E487A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="54" letter-spacing="4">HIPAA</text>

  <!-- Tag: CERTIFIED COMPLIANCE -->
  <rect x="155" y="348" width="190" height="28" rx="14" fill="#25B4E0" />
  <text x="250" y="367" text-anchor="middle" fill="#062947" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="15" letter-spacing="1.5">VERIFIED ALIGNED</text>
</svg>

