<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Top text arc -->
    <path id="topArc27001" d="M 65,250 A 185,185 0 0,1 435,250" fill="none" />
    <!-- Bottom text arc -->
    <path id="bottomArc27001" d="M 435,250 A 185,185 0 0,1 65,250" fill="none" />
    <!-- Gradient for premium seal depth -->
    <linearGradient id="blueGrad27001" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E5CAD" />
      <stop offset="100%" stop-color="#083870" />
    </linearGradient>
  </defs>

  <!-- Outer Circle -->
  <circle cx="250" cy="250" r="235" fill="url(#blueGrad27001)" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.3" />

  <!-- Top Arc Text: CERTIFIED -->
  <text fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="46" letter-spacing="7">
    <textPath href="#topArc27001" startOffset="50%" text-anchor="middle">CERTIFIED</textPath>
  </text>

  <!-- Bottom Arc Text: CERTIFIED -->
  <text fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="46" letter-spacing="7">
    <textPath href="#bottomArc27001" startOffset="50%" text-anchor="middle">CERTIFIED</textPath>
  </text>

  <!-- Left Star -->
  <polygon points="78,250 87,242 98,247 93,235 101,226 89,228 82,218 78,228 67,230 76,238" fill="#FFFFFF" transform="rotate(-15 84 235)" />
  <!-- Right Star -->
  <polygon points="422,250 413,242 402,247 407,235 399,226 411,228 418,218 422,228 433,230 424,238" fill="#FFFFFF" transform="rotate(15 416 235)" />

  <!-- Inner Circle Container -->
  <circle cx="250" cy="250" r="145" fill="#FFFFFF" stroke="#0E5CAD" stroke-width="10" />

  <!-- Globe Grid Lines inside Inner Circle -->
  <g stroke="#0E5CAD" stroke-width="3.5" fill="none" opacity="0.85">
    <!-- Outer boundary clip circle -->
    <clipPath id="globeClip">
      <circle cx="250" cy="250" r="140" />
    </clipPath>
    <g clip-path="url(#globeClip)">
      <!-- Latitude Parallels -->
      <line x1="110" y1="205" x2="390" y2="205" />
      <line x1="110" y1="250" x2="390" y2="250" />
      <line x1="110" y1="295" x2="390" y2="295" />
      <!-- Longitude Meridians -->
      <ellipse cx="250" cy="250" rx="90" ry="140" />
      <ellipse cx="250" cy="250" rx="45" ry="140" />
      <line x1="250" y1="110" x2="250" y2="390" stroke-width="4" />
    </g>
  </g>

  <!-- ISO 27001 Center Typography -->
  <rect x="150" y="165" width="200" height="70" fill="#FFFFFF" fill-opacity="0.95" rx="10" />
  <text x="250" y="228" text-anchor="middle" fill="#0E5CAD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="78" letter-spacing="2">ISO</text>

  <rect x="130" y="248" width="240" height="76" fill="#FFFFFF" fill-opacity="0.95" rx="10" />
  <text x="250" y="318" text-anchor="middle" fill="#0E5CAD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="70" letter-spacing="1">27001</text>
</svg>

