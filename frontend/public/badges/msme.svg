<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <path id="topArcMsme" d="M 70,250 A 180,180 0 0,1 430,250" fill="none" />
    <path id="bottomArcMsme" d="M 430,250 A 180,180 0 0,1 70,250" fill="none" />
    <linearGradient id="msmeTricolor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#138808" />
    </linearGradient>
  </defs>

  <!-- Outer Circle in Deep Sovereign Navy -->
  <circle cx="250" cy="250" r="235" fill="#0A2A54" />
  
  <!-- Tricolor Accent Ring -->
  <circle cx="250" cy="250" r="222" fill="none" stroke="#FF9933" stroke-width="4" stroke-dasharray="14 4" />
  <circle cx="250" cy="250" r="214" fill="none" stroke="#138808" stroke-width="3" />

  <!-- Hindi Header Arc Text -->
  <text fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="28" letter-spacing="2">
    <textPath href="#topArcMsme" startOffset="50%" text-anchor="middle">सूक्ष्म, लघु एवं मध्यम उद्यम</textPath>
  </text>

  <!-- English Bottom Arc Text: UDYAM REGISTERED -->
  <text fill="#FFCC00" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="28" letter-spacing="4">
    <textPath href="#bottomArcMsme" startOffset="50%" text-anchor="middle">UDYAM REGISTERED • INDIA</textPath>
  </text>

  <!-- Left Star in Tricolor Gold -->
  <circle cx="85" cy="250" r="7" fill="#FF9933" />
  <circle cx="85" cy="250" r="4" fill="#FFFFFF" />
  <!-- Right Star -->
  <circle cx="415" cy="250" r="7" fill="#138808" />
  <circle cx="415" cy="250" r="4" fill="#FFFFFF" />

  <!-- Inner Circle White Container -->
  <circle cx="250" cy="250" r="142" fill="#FFFFFF" stroke="#0A2A54" stroke-width="8" />

  <!-- Industrial Gear / Wheel Cog Silhouette -->
  <g fill="#EAF1F8">
    <circle cx="250" cy="235" r="95" />
  </g>

  <!-- Stylized MSME Rising Figures (Tricolor + Navy) -->
  <!-- Left Figure (Green) -->
  <circle cx="205" cy="195" r="14" fill="#138808" />
  <path d="M 190,240 C 190,215 220,215 220,240 Z" fill="#138808" />

  <!-- Center Figure (Sovereign Navy - Tallest) -->
  <circle cx="250" cy="180" r="16" fill="#0A2A54" />
  <path d="M 230,240 C 230,205 270,205 270,240 Z" fill="#0A2A54" />

  <!-- Right Figure (Saffron Orange) -->
  <circle cx="295" cy="195" r="14" fill="#FF9933" />
  <path d="M 280,240 C 280,215 310,215 310,240 Z" fill="#FF9933" />

  <!-- Central Prominent MSME Wordmark -->
  <rect x="140" y="248" width="220" height="60" rx="8" fill="#0A2A54" />
  <text x="250" y="296" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="48" letter-spacing="5">MSME</text>

  <!-- Small Government of India Subtitle -->
  <text x="250" y="332" text-anchor="middle" fill="#0A2A54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" letter-spacing="1.5">GOVT. OF INDIA</text>
  <text x="250" y="352" text-anchor="middle" fill="#138808" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" letter-spacing="1">UDYAM ENTERPRISE</text>
</svg>

