<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <path id="topArcPci" d="M 65,250 A 185,185 0 0,1 435,250" fill="none" />
    <path id="bottomArcPci" d="M 435,250 A 185,185 0 0,1 65,250" fill="none" />
    <linearGradient id="pciGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14345C" />
      <stop offset="100%" stop-color="#091B33" />
    </linearGradient>
  </defs>

  <!-- Outer Circle -->
  <circle cx="250" cy="250" r="235" fill="url(#pciGrad)" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="#F5A623" stroke-width="4" stroke-opacity="0.85" />

  <!-- Top Arc Text: PCI DSS COMPLIANT -->
  <text fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="38" letter-spacing="5">
    <textPath href="#topArcPci" startOffset="50%" text-anchor="middle">PCI DSS COMPLIANT</textPath>
  </text>

  <!-- Bottom Arc Text: PAYMENT CARD SECURITY -->
  <text fill="#F5A623" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="28" letter-spacing="3">
    <textPath href="#bottomArcPci" startOffset="50%" text-anchor="middle">SECURITY VALIDATED</textPath>
  </text>

  <!-- Left Star in Gold -->
  <polygon points="78,250 87,242 98,247 93,235 101,226 89,228 82,218 78,228 67,230 76,238" fill="#F5A623" transform="rotate(-15 84 235)" />
  <!-- Right Star in Gold -->
  <polygon points="422,250 413,242 402,247 407,235 399,226 411,228 418,218 422,228 433,230 424,238" fill="#F5A623" transform="rotate(15 416 235)" />

  <!-- Inner Circle Container -->
  <circle cx="250" cy="250" r="145" fill="#FFFFFF" stroke="#14345C" stroke-width="8" />

  <!-- Payment Card & Shield Illustration -->
  <rect x="180" y="160" width="140" height="90" rx="8" fill="#14345C" />
  <line x1="180" y1="185" x2="320" y2="185" stroke="#091B33" stroke-width="12" />
  <!-- EMV Gold Chip -->
  <rect x="195" y="205" width="28" height="22" rx="3" fill="#F5A623" stroke="#D48806" stroke-width="1.5" />
  <line x1="195" y1="216" x2="223" y2="216" stroke="#D48806" stroke-width="1" />
  <line x1="209" y1="205" x2="209" y2="227" stroke="#D48806" stroke-width="1" />

  <!-- Green Verified Security Shield Badge overlapping card -->
  <circle cx="295" cy="235" r="24" fill="#00A86B" stroke="#FFFFFF" stroke-width="3.5" />
  <path d="M 285,235 L 292,242 L 305,229" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Prominent PCI DSS Wordmark -->
  <text x="250" y="322" text-anchor="middle" fill="#14345C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="46" letter-spacing="3">PCI DSS</text>

  <!-- Tag: DATA SECURITY STANDARD -->
  <rect x="145" y="338" width="210" height="30" rx="15" fill="#F5A623" />
  <text x="250" y="358" text-anchor="middle" fill="#091B33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="14" letter-spacing="1.5">PAYMENT SECURITY</text>
</svg>

